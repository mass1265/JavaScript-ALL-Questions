        { id: 4, parentId: 2, name: 'Android' }
    ];

    const result = [];

    categories.forEach(item => {
        map.set(item.id, { ...item, children: [] });

        if (item.parentId === null) {
            result.push(map.get(item.id));
        } else {
            map.get(item.parentId)?.children.push(map.get(item.id));
        }
    });
