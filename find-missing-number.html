<script>
    const arr = [1, 2, 4, 5, 6, 7];

    const n = arr.length + 1;

    const expectedSum = n * (n + 1) / 2;

    const actualSum = arr.reduce((sum, value) => {
        return sum + value;
    }, 0);

    const missingNumber = expectedSum - actualSum;

    console.log(missingNumber);
</script>
