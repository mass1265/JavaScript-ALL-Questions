<script>
    const orders = [
        { id: 1, customer: "A", amount: 500, status: "paid" },
        { id: 2, customer: "B", amount: 700, status: "pending" },
        { id: 3, customer: "A", amount: 300, status: "paid" },
        { id: 4, customer: "A", amount: 200, status: "pending" }
    ];

    let res = {}
    for (const value of orders) {
        if (!res[value.customer]) {
            res[value.customer] = {
                paid: 0,
                pending: 0
            }
        }

        res[value.customer][value.status] += value.amount
    }
    console.log(res)
</script>
